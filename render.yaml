services:
  - type: web
    name: sinner-bot
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: OWNER_USERNAME
        value: Sinconviction
      - key: NODE_VERSION
        value: "22"
